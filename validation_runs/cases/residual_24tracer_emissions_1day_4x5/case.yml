schema_version: 1
name: residual_24tracer_emissions_1day_4x5
title: Residual 24-tracer emissions at 4x5, one day
purpose: >
  Run the residual emissions configuration for one day on the GEOS 4x5,
  47-level grid and compare HISTORY and ObsOperator output.
tags: [4x5, residual, emissions, multi-tracer, quick-history]

defaults:
  grid: geos_4x5_47
  transport_timestep_s: 600
  meteorology_root: "{repo}/external_data/geoschem/GEOS_4x5/MERRA2"

modes:
  quick:
    comparisons: [species_conc, obsoperator]

stages:
  - id: main
    start: "2014-09-01 00:00"
    end: "2014-09-02 00:00"
    engines:
      geoschem:
        template_dir: ../residual_24tracer_emissions_1day_2x25/geoschem/main
        work_dir: "{work}/main/geoschem"
        compile_script: compile_geoschem.sh
        run_script: run_geoschem.sh
        materialize_replacements:
          geoschem_config.yml:
            "resolution: 2.0x2.5": "resolution: 4.0x5.0"
          HEMCO_Config.rc:
            "external_data/geoschem/GEOS_2x2.5/MERRA2": "external_data/geoschem/GEOS_4x5/MERRA2"
      wombat:
        template_dir: ../residual_24tracer_emissions_1day_2x25/wombat/main
        work_dir: "{work}/main/wombat"
        materialize_replacements:
          run.yml:
            "grid_template: ../../../../../external_data/restarts/2x25/GEOSChem.Restart.20140901_0000z.nc4": "grid_template: ../../../../../external_data/restarts/4x5/GEOSChem.Restart.20140901_0000z.nc4"
            "external_data/geoschem/GEOS_2x2.5/MERRA2": "external_data/geoschem/GEOS_4x5/MERRA2"
            "rank3: [1, 91, 144]": "rank3: [1, 46, 72]"
            "rank4: [1, 1, 91, 144]": "rank4: [1, 1, 46, 72]"
    initial_restart:
      geoschem: null
      wombat: null
    comparisons:
      - id: species_conc
        kind: species_conc
        geoschem_glob: "OutputDir/GEOSChem.SpeciesConcThreeHourly.*.nc4"
        wombat_glob: "OutputDir/GEOSChem.SpeciesConcThreeHourly.*.nc4"
        fields: ["SpeciesConcVV_?ALL?"]
        tolerance_mode: report
      - id: obsoperator
        kind: obsoperator
        geoschem_glob: "OutputDir/GEOSChem.ObsOperator.*.nc4"
        wombat_glob: "OutputDir/GEOSChem.ObsOperator.*.nc4"
        fields: [id_index, field_index, sample]
        tolerance_mode: report
