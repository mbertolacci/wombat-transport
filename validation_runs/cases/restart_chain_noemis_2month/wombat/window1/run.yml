name: restart_chain_noemis_2month_window1_wombat
source_run_dir: .
species_database: ./species_database.yml
initial_restart: ../../../../../base/Restarts/GEOSChem.Restart.20140901_0000z.nc4
grid_template: ../../../../../base/Restarts/GEOSChem.Restart.20140901_0000z.nc4
output_dir: ./OutputDir
simulation:
  start: "2014-09-01 00:00"
  end: "2014-10-01 00:00"
  transport_timestep_s: 600
  emissions_timestep_s: 1200
meteorology:
  root: ../../../../../ExtData/GEOS_2x2.5/MERRA2
emissions:
  unit_conversion: none
  missing_species: zero
  scales: {}
  fields: []
logging:
  level: info
outputs:
  obsoperator:
    activate: true
    verbose: false
    input_file: ./ObsOperator/obsoperator-YYYYMMDD.yml.gz
    output_file: ./OutputDir/GEOSChem.ObsOperator.YYYYMMDD_hhmmz.nc4
    restart_file: ./Restarts/Wombat.ObsOperator.Restart.YYYYMMDD_hhmmss.nc4
    restart_missing: warn
  expid: OutputDir/GEOSChem
  dtype: float32
  compression:
    enabled: true
    level: 1
    shuffle: true
  chunking:
    rank1: [512]
    rank2:
    rank3: [1, 91, 144]
    rank4: [1, 1, 91, 144]
  collections:
    Restart:
      filename: ./Restarts/GEOSChem.Restart.%y4%m2%d2_%h2%n2z.nc4
      frequency: 00000100 000000
      duration: 00000100 000000
      mode: instantaneous
      fields:
        - SpeciesRst_?ALL?
        - Met_DELPDRY
        - Met_PS1WET
        - Met_PS1DRY
        - Met_SPHU1
        - Met_TMPU1
    SpeciesConcDaily:
      template: "%y4%m2%d2_%h2%n2z.nc4"
      frequency: 00000001 000000
      duration: 00000100 000000
      mode: time-averaged
      fields:
        - SpeciesConcVV_?ADV?
diagnostics: {}
comparison:
  {}
