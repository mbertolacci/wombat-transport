schema_version: 1
name: realistic_restart_noemis
title: Realistic restart, no emissions
purpose: >
  Transport a spatially varying GEOS-Chem CO2 restart field without emissions
  and compare normal SpeciesConc HISTORY output over a short window.
tags: [noemis, restart-initialized, quick-history]

defaults:
  grid: geos_2x25_47
  transport_timestep_s: 600
  meteorology_root: "{repo}/ExtData/GEOS_2x2.5/MERRA2"

modes:
  quick:
    comparisons: [species_conc]
  restart:
    comparisons: [species_conc, restart]

stages:
  - id: main
    start: "2014-09-01 00:00"
    end: "2014-09-03 00:00"
    engines:
      geoschem:
        template_dir: geoschem/main
        work_dir: "{work}/main/geoschem"
        compile_script: compile_geoschem.sh
        run_script: run_geoschem.sh
      wombat:
        template_dir: wombat/main
        work_dir: "{work}/main/wombat"
    initial_restart:
      geoschem: "{repo}/base/Restarts/GEOSChem.Restart.20140901_0000z.nc4"
      wombat: "{repo}/base/Restarts/GEOSChem.Restart.20140901_0000z.nc4"
    comparisons:
      - id: species_conc
        kind: species_conc
        geoschem_glob: "OutputDir/GEOSChem.SpeciesConcThreeHourly.*.nc4"
        wombat_glob: "OutputDir/GEOSChem.SpeciesConcThreeHourly.*.nc4"
        fields: ["SpeciesConcVV_?ALL?"]
        tolerance_mode: report
      - id: restart
        kind: restart
        geoschem_glob: "Restarts/GEOSChem.Restart.20140903_0000z.nc4"
        wombat_glob: "Restarts/GEOSChem.Restart.20140903_0000z.nc4"
        fields:
          - SpeciesRst_?ALL?
          - Met_DELPDRY
          - Met_PS1DRY
          - Met_PS1WET
          - Met_SPHU1
          - Met_TMPU1
        tolerance_mode: report
