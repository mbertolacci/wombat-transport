name: residual_20140901_part001_split01_wombat
source_run_dir: ../residual_20140901_part001_split01
species_database: ../residual_20140901_part001_split01/species_database.yml
initial_restart:
grid_template: ../base/Restarts/GEOSChem.Restart.20140901_0000z.nc4
output_dir: ./OutputDir
simulation:
  start: "2014-09-01 00:00"
  end: "2014-09-05 23:00"
  transport_timestep_s: 600
  emissions_timestep_s: 1200
meteorology:
  root: ../ExtData/GEOS_2x2.5/MERRA2
emissions: emissions.yml
logging:
  level: info
outputs:
  expid: OutputDir/GEOSChem
  collections:
    Restart:
      filename: ./Restarts/GEOSChem.Restart.%y4%m2%d2_%h2%n2z.nc4
      frequency: 00000100 000000
      duration: 00000100 000000
      mode: instantaneous
      fields:
        - SpeciesRst_?ALL?
        - Met_DELPDRY
        - Met_PS1WET
        - Met_PS1DRY
        - Met_SPHU1
        - Met_TMPU1
    SpeciesConcThreeHourly:
      template: "%y4%m2%d2_%h2%n2z.nc4"
      frequency: 00000000 030000
      duration: 00000001 000000
      mode: time-averaged
      fields:
        - SpeciesConcVV_?ADV?
diagnostics:
  species_conc_sample: ../residual_20140901_part001_split01/OutputDir/GEOSChem.SpeciesConcThreeHourly.20140901_0000z.nc4
  hemco_sample: ../residual_20140901_part001_split01/OutputDir/HEMCO_diagnostics.201409010030.nc
  monthly_restart_sample: ../residual_20140901_part001_split01/Restarts/GEOSChem.Restart.20141001_0000z.nc4
comparison:
  species_conc_sample: ../residual_20140901_part001_split01/OutputDir/GEOSChem.SpeciesConcThreeHourly.20140904_0000z.nc4
  species_conc_time_index: -1
