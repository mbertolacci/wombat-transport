name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            numpy-version: "1.26.4"
          - python-version: "3.12"
            numpy-version: "1.26.4"
          - python-version: "3.12"
            numpy-version: "2.3.5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install selected NumPy version
        run: python -m pip install "numpy==${{ matrix.numpy-version }}"
      - name: Install project and CPU development dependencies
        run: python -m pip install -e '.[cpu,dev]'
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: ruff check
      - name: Run Vulture
        run: vulture --config pyproject.toml
