[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wombat-transport"
version = "0.1.0"
description = "Parity-first GEOS-Chem Classic transport for high-throughput CO2-like tracer ensembles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "netCDF4",
    "py-yaml12>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
docs = [
    "zensical==0.0.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
