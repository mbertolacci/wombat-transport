[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wombat-transport"
version = "0.1.0"
description = "Parity-first GEOS-Chem Classic transport for high-throughput CO2-like tracer ensembles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.4",
    "netCDF4",
    "py-yaml12>=0.1.0",
]

[project.optional-dependencies]
cpu = [
    "numba==0.66.*",
]
cuda = [
    "cupy-cuda12x==13.6.*",
]
dev = [
    "pytest",
    "ruff==0.15.22",
    "vulture==2.16",
]
docs = [
    "zensical==0.0.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wombat_transport.cuda.sources" = ["*.cu", "*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cuda: requires an available NVIDIA CUDA device",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B007", "B905"]

[tool.vulture]
paths = ["src", "tests", "tools"]
min_confidence = 80
sort_by_size = true
